services:
  api:
    build: .
    init: true
    user: "${API_UID:-1000}:${API_GID:-1000}"
    group_add: ["${DOCKER_GID:-0}"]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      NODE_ENV: production
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      HOST: 0.0.0.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the frontend origin}
      DB_URI: ${DB_URI:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-file}
      DATA_DIR: /app/data
      JOBS_DIR: ${JOBS_DIR:-/tmp/sorobuild-jobs}
      AI_MODEL: ${AI_MODEL:-}
      AI_URL: ${AI_URL:-http://host.docker.internal:11434/api/chat}
    volumes:
      - ./data:/app/data
      - ${JOBS_DIR:-/tmp/sorobuild-jobs}:${JOBS_DIR:-/tmp/sorobuild-jobs}
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    stop_grace_period: 660s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
